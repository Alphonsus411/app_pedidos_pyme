name: CI (Universal Business Core — Architectural Baseline)

on:
  push:
    branches:
      - master
      - feat/architectural-baseline
  pull_request:
    branches:
      - master
      - feat/architectural-baseline

permissions:
  contents: read

jobs:
  baseline:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install baseline (with dev + docs extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (src/)
        run: mypy src

      - name: pytest (unit + architecture + imports)
        run: python -m pytest -q
