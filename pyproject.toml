[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-business-core"
version = "0.1.0"
description = "Universal Business Core - Architectural Baseline (Entrega 0.1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Universal Business Core Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = [
    # Gate 0.1 reproducibilidad: rangos cerrados minor para tooling.
    # Evita saltos de versiones breaking en Gates estables.
    # Versiones validadas actualmente local + CI: pytest 8.4.2 / ruff 0.15.16 / mypy 2.1.0
    "pytest>=8,<9",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<3",
]
docs = [
    # Generación del PDF del plan. NO es dependencia runtime del core.
    # Instalación: pip install -e ".[docs]" ; python docs/_gen_plan_pdf.py
    "fpdf2>=2.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["universal_business*"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

# ---------------- ruff ----------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [
    "docs/_gen_plan_pdf.py",  # script auxiliar de generación, no pertenece al core
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["universal_business", "tests"]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Gate 0.1-RC1: strict global activo para TODOS los módulos del core.
# Catalog/resources/availability/reservations/orders/fulfillment pasan strict.
# NO hay overrides laxos injustificados.
